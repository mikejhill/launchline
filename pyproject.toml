[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "launchline"
dynamic = ["version"]
description = "A lightweight terminal launcher for interactive CLI tools."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "Mike Hill" }]
keywords = ["terminal", "launcher", "cli", "menu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mikejhill/launchline"
Repository = "https://github.com/mikejhill/launchline"
Issues = "https://github.com/mikejhill/launchline/issues"
Changelog = "https://github.com/mikejhill/launchline/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pexpect>=4.9 ; sys_platform != 'win32'",
    "poethepoet>=0.49.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pywinpty>=3 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
    "ty>=0.0.91",
]
screenshots = [
    "pillow>=13.0.0",
    "pyte>=0.8",
]

[project.scripts]
launchline = "launchline.__main__:Application.main"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "D", "ANN", "PT", "RET", "ARG"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102"]
"tools/**" = ["D100", "D104", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["launchline"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "launchline.keys"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=launchline --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["launchline"]
branch = true
omit = ["src/launchline/_version.py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel.hooks.vcs]
version-file = "src/launchline/_version.py"
template = '''
"""Build-generated distribution version."""

from __future__ import annotations

__version__ = "{version}"
'''


[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ty.rules]
all = "error"

[tool.poe.tasks]
format = "ruff format src tests scripts docs/validation/benchmark.py"
format-check = "ruff format --check src tests scripts docs/validation/benchmark.py"
lint = "ruff check src tests scripts"
lint-fix = "ruff check src tests scripts --fix"
typecheck = "ty check src"
test = "pytest --junitxml=junit.xml"
benchmark = "python docs/validation/benchmark.py docs/validation/current.json"
fix = ["format", "lint-fix", "format"]
check = ["format-check", "lint", "typecheck", "test"]
test-fast = "pytest -q -o addopts= --ignore=tests/test_terminal_e2e.py --ignore=tests/test_providers.py"
check-fast = ["format-check", "lint", "typecheck", "test-fast"]
benchmark-ui = "python scripts/benchmark_ui.py .tmp/ui-current.json"
build = "uv build"
artifact-check = "python scripts/release_artifacts.py --check-build"
release-check = ["check", "build", "artifact-check", "package-smoke"]

[tool.poe.tasks.package-smoke]
cmd = "python scripts/package_smoke.py"

[tool.poe.tasks.mutation]
cmd = "python scripts/mutation_check.py python"

[tool.poe.tasks.mutation-menus]
cmd = "python scripts/mutate_menus.py python"
