name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      force-patch:
        description: Force patch bump when no releasable commits exist
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  target:
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - name: Download checksum-pinned semantic-release CLI
      shell: bash
      run: "set -euo pipefail\ndest=\"$RUNNER_TEMP/semantic-release-v2.31.0\"\ncurl --fail --silent --show-error --location\
        \ --proto '=https' --tlsv1.2 \\\n  https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64\
        \ \\\n  --output \"$dest\"\nprintf '%s  %s\\n' 'b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3'\
        \ \"$dest\" | sha256sum --check --strict\nchmod 0755 \"$dest\"\n"
    - name: Preload verified runtime plugins
      run: python3 scripts/prepare_semrel.py
    - name: Determine version without publishing
      id: semrel
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FORCE_PATCH: ${{ inputs.force-patch || false }}
      run: 'set -euo pipefail

        args=(--dry --allow-initial-development-versions --changelog release-changelog.md --allow-no-changes --plugin-resolver-disable-batch-prefetch)

        if [ "$FORCE_PATCH" = true ]; then args+=(--force-bump-patch-version); fi

        "$RUNNER_TEMP/semantic-release-v2.31.0" "${args[@]}"

        python3 scripts/release_version.py

        '
    name: Target
  ci:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        python-version: ${{ matrix.python }}
    - run: uv sync --locked --group dev
    - run: uv run poe check
    - run: uv build
    - run: uv run python scripts/package_smoke.py
    - run: uv run poe mutation
      if: matrix.os == 'windows-latest'
    - name: Test results
      if: always()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: junit.xml
        annotate_only: true
        check_annotations: false
        check_retries: false
        require_tests: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: evidence-${{ matrix.os }}-${{ matrix.python }}
        path: 'junit.xml

          docs/validation/*json

          '
        if-no-files-found: error
    needs: target
    if: needs.target.outputs.version != ''
  build:
    needs:
    - target
    - ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - name: Build tested version without publishing credentials
      run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

        uv sync --locked --group dev

        uv run poe check

        python3 - <<''PY''

        import os,pathlib

        p=pathlib.Path(''README.md'')

        p.write_text(p.read_text().replace(''(docs/'', ''(https://raw.githubusercontent.com/''+os.environ[''GITHUB_REPOSITORY'']+''/v''+os.environ[''VERSION'']+''/docs/''))

        PY

        uv build

        uv run python scripts/package_smoke.py

        printf ''Built from reviewed main commit %s\n'' "$GITHUB_SHA" > release-notes.md

        '
      env:
        VERSION: ${{ needs.target.outputs.version }}
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.target.outputs.version }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: dist
      with:
        name: trusted-release
        path: 'dist/*

          release-notes.md'
        if-no-files-found: error
        retention-days: 7
    name: Build
  github-release:
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.build.result
      == 'success'
    needs:
    - target
    - build
    - attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Create immutable refs and upload tested release artifacts.
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - name: Publish same-run artifacts from trusted merge
      run: "# The approved immutable-v* ruleset must already prohibit tag updates/deletion.\nancestor=$(gh api \"repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main\"\
        \ --jq .merge_base_commit.sha)\ntest \"$ancestor\" = \"$GITHUB_SHA\" || { echo 'Release commit is no longer on main.'\
        \ >&2; exit 1; }\npython3 - <<'PY'\nimport json,os,pathlib,re\nassert re.fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+',os.environ['TAG'])\n\
        assert re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA'])\npathlib.Path('release-ref.json').write_text(json.dumps({'ref':'refs/tags/'+os.environ['TAG'],'sha':os.environ['GITHUB_SHA']}))\n\
        PY\n# Ref creation is atomic: if another process created it first, accept only the same commit.\nif ! gh api --method\
        \ POST \"repos/$GITHUB_REPOSITORY/git/refs\" --input release-ref.json >/dev/null 2>tag-create-error.txt; then\n  actual=$(gh\
        \ api \"repos/$GITHUB_REPOSITORY/commits/$TAG\" --jq .sha)\n  test \"$actual\" = \"$GITHUB_SHA\" || { echo 'Tag creation\
        \ failed or a conflicting tag exists.' >&2; exit 1; }\nfi\nactual=$(gh api \"repos/$GITHUB_REPOSITORY/commits/$TAG\"\
        \ --jq .sha)\ntest \"$actual\" = \"$GITHUB_SHA\" || { echo 'Tag does not match the trusted merge.' >&2; exit 1; }\n\
        if gh release view \"$TAG\" --repo \"$GITHUB_REPOSITORY\" >/dev/null 2>&1; then\n  :\nelse\n  gh release create \"\
        $TAG\" --repo \"$GITHUB_REPOSITORY\" --verify-tag --title \"$TAG\" --generate-notes --notes-file release/release-notes.md\n\
        fi\ngh release upload \"$TAG\" release/dist/* --repo \"$GITHUB_REPOSITORY\" --clobber\n"
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v${{ needs.target.outputs.version }}
    name: Github Release
  pypi:
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.github-release.result
      == 'success'
    needs:
    - target
    - build
    - github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write # OIDC identity for attestation or trusted PyPI publishing.
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: release/dist/
        skip-existing: true
    name: Pypi
  attest:
    name: Attest tested artifacts
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.build.result
      == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC identity for attestation or trusted PyPI publishing.
      attestations: write # Store provenance for these same-run build artifacts.
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: release
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: release/dist/*
