name: CI
'on':
  workflow_call: null
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Require the release PR head to match this immutable commit
        type: string
        required: false
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Verify dispatched release PR head
      if: github.event_name == 'workflow_dispatch' && inputs.expected-sha != ''
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: |
        set -euo pipefail
        [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        python-version: ${{ matrix.python }}
    - run: uv sync --locked --group dev
    - run: uv run poe check
    - run: uv build
    - name: Validate actual distribution output
      run: uv run python scripts/release_artifacts.py --check-build
    - run: uv run python scripts/package_smoke.py
    - name: Test results
      if: always()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: junit.xml
        annotate_only: true
        check_annotations: false
        check_retries: false
        require_tests: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: evidence-${{ matrix.os }}-${{ matrix.python }}
        path: |
          junit.xml
          docs/validation/*json
        if-no-files-found: error
